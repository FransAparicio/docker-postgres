services:
  bd_postgres:
    container_name: bd_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: db_prueba
    ports:
      - "5444:5432"
    volumes:
      - postgres_data2:/var/lib/postgresql/data
    
  bd_pgadmin:
    container_name: bd_pgadmin
    image: dpage/pgadmin4
    depends_on:
      - bd_postgres
    ports:
      - "8083:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mail.com
      PGADMIN_DEFAULT_PASSWORD: admin54321

volumes:
  postgres_data2: